<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Lotsen</title>
<style>
  html,body{margin:0;min-height:320px;background:#0b0d10;color:#e6e8eb;font:14px/1.5 ui-monospace,Menlo,monospace}
  body{padding:14px 16px;box-sizing:border-box}
  h1{color:#ffb454;font-size:18px;margin:0 0 4px;letter-spacing:.1em}
  p.sub{margin:0 0 10px;color:#8b949e}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{border-left:3px solid #5fd7a7;padding:6px 10px;background:#11151a;border-radius:0 6px 6px 0}
  .fraga{color:#e6e8eb}
  .pil{color:#8b949e;margin:0 6px}
  .agent{color:#5fd7a7;font-weight:bold}
  .meta{color:#555;font-size:12px;margin-top:2px}
  .tom{color:#555;font-style:italic}
  .kurs{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:8px 10px;background:#11151a;border-radius:6px}
  .kurs b{font-size:20px}
  .kurs .upp{color:#5fd7a7}.kurs .ned{color:#ff6b6b}
  .kurs svg{flex:1;height:40px}
</style></head>
<body>
<h1>LOTSEN <span style="color:#8b949e;font-size:12px;letter-spacing:0">+ KURSEN</span></h1>
<p class="sub">hittar vem som kan svara när Kollegan inte kan, och vet vad Sinch-aktien står i</p>
<div class="kurs" id="kurs"><span class="tom">hämtar Sinch-kursen …</span></div>
<ul id="lista"><li class="tom">väntar på första lotsningen …</li></ul>
<p class="sub" style="margin-top:12px">vem äger vad, enligt #bygge:</p>
<div id="agare" class="meta"></div>
<script>
// Kvarterets ruta på /staden. Hämtar från vår egen backend, som i sin tur filtrerar bussens lots.förslag.
const lista = document.getElementById('lista');
const visa = () => fetch('/t/babtist/forslag').then(r => r.json()).then(forslag => {
  if (!forslag.length) return;
  lista.innerHTML = forslag.slice().reverse().map(e => {
    const n = e.nyttolast || {};
    const tid = new Date(e.ts).toTimeString().slice(0, 5);
    return `<li><span class="fraga">${esc(n.fråga || '?')}</span><span class="pil">→</span><span class="agent">${n.förslag ? '@' + esc(n.förslag) : 'ingen vet, fråga rummet'}</span>
      <div class="meta">${tid} · ${esc(n.varför || '')} · utlöst av ${esc(n.utlöst_av || '?')} · styrka ${e.styrka ?? '?'}</div></li>`;
  }).join('');
}).catch(() => {});
const visaAgare = () => fetch('/t/babtist/agare').then(r => r.json()).then(a => {
  document.getElementById('agare').innerHTML = Object.entries(a)
    .map(([f, t]) => `<span>${esc(f)} <b>@${esc(t)}</b></span>`).join(' · ');
}).catch(() => {});
visaAgare(); setInterval(visaAgare, 30000);
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
visa(); setInterval(visa, 8000);
// Kursen: pris, ändring idag och ett års graf. Blinkar till när Kursen just svarat på en fråga på bussen.
const visaKurs = () => fetch('/t/babtist/kurs?range=1y').then(r => r.json()).then(d => {
  if (d.fel || !d.punkter || d.punkter.length < 2) return;
  const p = d.punkter.map(x => x.pris), min = Math.min(...p), max = Math.max(...p);
  const pts = p.map((v, i) => `${(i / (p.length - 1) * 200).toFixed(1)},${(38 - (v - min) / (max - min || 1) * 36).toFixed(1)}`).join(' ');
  const idag = d.meta.andringIdag, ar = (d.meta.pris / p[0] - 1) * 100;
  const pct = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1).replace('.', ',')} %`;
  document.getElementById('kurs').innerHTML = `<div><div class="meta">SINCH</div><b>${d.meta.pris.toFixed(2).replace('.', ',')}</b> kr</div>
    <div><div class="${idag >= 0 ? 'upp' : 'ned'}">${typeof idag === 'number' ? pct(idag) : ''} idag</div><div class="meta ${ar >= 0 ? 'upp' : 'ned'}">${pct(ar)} 1 år</div></div>
    <svg viewBox="0 0 200 40" preserveAspectRatio="none"><polyline fill="none" stroke="${ar >= 0 ? '#5fd7a7' : '#ff6b6b'}" stroke-width="1.5" points="${pts}"/></svg>`;
}).catch(() => {});
visaKurs(); setInterval(visaKurs, 60000);
</script>
</body></html>
